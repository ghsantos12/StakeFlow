name: Release APK

# Roda a cada push na main. Só cria uma release nova quando a versão em
# pubspec.yaml ainda não tiver uma tag publicada — ou seja, para lançar
# uma atualização basta bumpar o "version:" do pubspec.yaml e dar push.
# O app (lib/src/domain/services/update_service.dart) consulta a release
# mais recente do GitHub e avisa o usuário quando ela for mais nova que a
# versão instalada.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Ler versão do pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version:[[:space:]]*//' | sed 's/+.*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checar se a tag já tem release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.version.outputs.tag }}")
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Flutter
        if: steps.check.outputs.exists == 'false'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Instalar dependências
        if: steps.check.outputs.exists == 'false'
        run: flutter pub get

      # Decodifica a keystore de release a partir do segredo do repositório
      # para que todo build (local ou CI) assine o APK com a mesma chave —
      # caso contrário o Android recusa instalar updates por cima do app já
      # instalado ("app não instalado"). Precisa dos segredos
      # RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD,
      # RELEASE_KEY_ALIAS e RELEASE_KEY_PASSWORD configurados no repositório
      # (Settings → Secrets and variables → Actions).
      - name: Configurar keystore de release
        if: steps.check.outputs.exists == 'false'
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/stakeflow-release.keystore
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          storeFile=stakeflow-release.keystore
          EOF

      # O build usa compileSdk 36 / NDK 28.x, que o runner do GitHub pode
      # não ter licenciado ainda. Sem isso, o Gradle fica esperando uma
      # confirmação interativa que nunca chega e o job trava indefinidamente
      # (foi o que aconteceu nos builds de v1.0.1 e v1.0.2).
      - name: Aceitar licenças do Android SDK
        if: steps.check.outputs.exists == 'false'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build APK (release)
        if: steps.check.outputs.exists == 'false'
        timeout-minutes: 20
        run: flutter build apk --release

      - name: Publicar release com o APK
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: StakeFlow ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
